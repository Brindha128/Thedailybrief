<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe</title>
    
</head>
<body style="background-color: rgb(156, 209, 191); font-style: italic;">

   

    <h1>Subscribe to The Daily Brief</h1>
    <p>"Get the latest news delivered to your inbox every day"</p>
    <form>
        <label for="Name">Name:</label>
        <input type="text" id="Name" name="name" required placeholder="Enter your name"> <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email"> <br><br>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number"> <br><br>
<label for="age">Age:</label>
<input type="number" id="age" name="age" required placeholder="Enter your age"> <br><br>
<label for="gender">Gender:</label>
<select id="gender" name="gender" required>
    <option value="">Select your gender</option>
    <option value="male">Male</option>
    <option value="female">Female</option>
    <option value="other">Other</option>
</select> <br><br>
        <button type="submit">Subscribe</button> <br><br>
    </form>


<hr>

<a href="dailybrief.html">Home</a>  
</body>
</html>
